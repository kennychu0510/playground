<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <title>Squash Lab — first-person aim &amp; strike</title>
    <script type="module" crossorigin src="/playground/sims/squash/assets/index-Bk7zOURL.js"></script>
    <link rel="stylesheet" crossorigin href="/playground/sims/squash/assets/index-B4T6Dazq.css">
  </head>
  <body>
    <div id="app">
      <canvas id="c"></canvas>
      <div id="hud">
        <header class="top">
          <a class="back" href="../../">← Playground</a>
          <h1>Squash Lab</h1>
          <span id="score" class="score">0 – 0</span>
        </header>
        <div id="banner" class="banner">Choose L/R box · Serve</div>
        <div id="aim-ui" class="aim-ui hidden">
          <p id="aim-hint" class="aim-hint">Drag to look · set power · Hit</p>
          <div class="power-wrap">
            <div class="power-label">Power <span id="power-val">55%</span></div>
            <input id="power-slider" type="range" min="15" max="100" step="1" value="55" />
            <div class="power-track"><div id="power-fill" class="power-fill" style="width:55%"></div></div>
          </div>
          <button type="button" id="btn-hit" class="btn hit-btn">Hit</button>
        </div>
        <div id="crosshair" class="crosshair hidden"></div>
        <div class="bot-bar">
          <select id="serve-side" aria-label="Serve side">
            <option value="right">Serve R</option>
            <option value="left">Serve L</option>
          </select>
          <button type="button" id="btn-serve" class="btn">Serve</button>
        </div>
      </div>
    </div>
  </body>
</html>
